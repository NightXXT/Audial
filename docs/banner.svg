<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Audial, um cliente nativo de música para Windows 11">
  <style>
    .bar { transform-box: fill-box; transform-origin: center; animation: pulse 1.4s ease-in-out infinite alternate; }
    .b1 { animation-delay: -0.2s; animation-duration: 1.1s; }
    .b2 { animation-delay: -0.9s; animation-duration: 1.5s; }
    .b3 { animation-delay: -0.4s; animation-duration: 0.9s; }
    .b4 { animation-delay: -1.2s; animation-duration: 1.3s; }
    .b5 { animation-delay: -0.6s; animation-duration: 1.2s; }
    .b6 { animation-delay: -0.1s; animation-duration: 1s; }
    .b7 { animation-delay: -1s; animation-duration: 1.6s; }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 3s ease-out infinite; }
    .r2 { animation-delay: 1.5s; }
    .disc { transform-box: fill-box; transform-origin: center; animation: beat 1.6s ease-in-out infinite; }
    .glow { transform-box: fill-box; transform-origin: center; animation: beat 3.2s ease-in-out infinite; }
    .rise { animation: rise 0.9s ease-out both; }
    .d2 { animation-delay: 0.2s; }
    .d3 { animation-delay: 0.4s; }
    @keyframes pulse { from { transform: scaleY(0.35); } to { transform: scaleY(1.1); } }
    @keyframes ring { from { transform: scale(1); opacity: 0.55; } to { transform: scale(2.1); opacity: 0; } }
    @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .bar, .ring, .disc, .glow, .rise { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1224"/>
      <stop offset="0.55" stop-color="#14141F"/>
      <stop offset="1" stop-color="#0D0E12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F43F5E"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F43F5E" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1280" height="420" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <circle class="glow" cx="1040" cy="210" r="260" fill="url(#halo)"/>
    <circle class="ring" cx="1040" cy="210" r="96" fill="none" stroke="#FB7185" stroke-width="2"/>
    <circle class="ring r2" cx="1040" cy="210" r="96" fill="none" stroke="#EC4899" stroke-width="2"/>
    <g fill="url(#accent)">
      <rect class="bar b1" x="808" y="182" width="16" height="56" rx="8"/>
      <rect class="bar b2" x="840" y="146" width="16" height="128" rx="8"/>
      <rect class="bar b3" x="872" y="112" width="16" height="196" rx="8"/>
      <rect class="bar b4" x="904" y="158" width="16" height="104" rx="8"/>
      <rect class="bar b5" x="1160" y="158" width="16" height="104" rx="8"/>
      <rect class="bar b6" x="1192" y="122" width="16" height="176" rx="8"/>
      <rect class="bar b7" x="1224" y="172" width="16" height="76" rx="8"/>
    </g>
    <g class="disc">
      <rect x="950" y="120" width="180" height="180" rx="41" fill="url(#accent)"/>
      <path d="M988 263 L1040 156 L1092 263" fill="none" stroke="#FFFFFF" stroke-width="23.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1030.2 227.4 L1030.2 263 L1059.7 245.3 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6.6" stroke-linejoin="round"/>
    </g>
    <text class="rise" x="72" y="196" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="104" font-weight="700" fill="#FFFFFF" letter-spacing="-3">Audial</text>
    <text class="rise d2" x="76" y="252" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="30" fill="#D4D4D8">Sua música em um app nativo de verdade.</text>
    <text class="rise d3" x="76" y="300" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#FB7185" letter-spacing="2">WINUI 3  ·  .NET 8  ·  WINDOWS 11</text>
  </g>
</svg>
