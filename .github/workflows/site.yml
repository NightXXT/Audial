# Publica a pasta site/ no GitHub Pages (audial.com.br) a cada push na main que mexe nela.
# Site estático: sem servidor e sem banco. Ficam de fora a API antiga, o painel e os arquivos do servidor.
name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Monta o site
        run: |
          rsync -a --delete \
            --exclude 'api/' --exclude 'node_modules/' --exclude 'server.js' --exclude 'package*.json' \
            --exclude 'vercel.json' --exclude 'Dockerfile' --exclude 'docker-compose*' --exclude '.dockerignore' \
            --exclude 'painel.html' --exclude 'assets/painel.js' --exclude '.env*' --exclude '*.pem' \
            site/ _site/
          echo "audial.com.br" > _site/CNAME
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
