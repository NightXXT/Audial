<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Audial Overlay</title>
<style>
html, body { margin: 0; background: transparent; overflow: hidden; font-family: "Segoe UI", Arial, sans-serif; }
/* 440 x 120 in the live app: a 20 px strip on top for the white tag, then the card */
#stage { position: relative; width: 420px; margin: 20px 8px 0; }
#card { position: relative; z-index: 1; overflow: hidden; display: flex; align-items: center; gap: 14px; box-sizing: border-box; width: 420px; padding: 12px;
	border-radius: 16px; background: rgba(17, 19, 25, .86); border: 1px solid rgba(255, 255, 255, .1); color: #fff;
	opacity: 0; transform: translateY(8px); transition: opacity .35s, transform .35s; }
#card.on { opacity: 1; transform: none; }
#artbox { position: relative; flex: none; width: 72px; height: 72px; perspective: 320px; }
#art { display: block; width: 72px; height: 72px; border-radius: 10px; object-fit: cover; background: linear-gradient(45deg, #F43F5E, #EC4899); }
#ring { position: absolute; inset: 0; border-radius: 10px; pointer-events: none; }
#info { flex: 1; min-width: 0; }
#row { display: flex; align-items: center; gap: 10px; }
/* long titles fade out at the edge instead of "..." (the title is made of one span per letter for the entrance) */
#title { flex: 1; min-width: 0; font-size: 19px; font-weight: 600; white-space: nowrap; overflow: hidden;
	-webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent); }
#title .ch { display: inline-block; white-space: pre; }
#artist { font-size: 14px; color: #D4D4D8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#bar { height: 4px; margin-top: 8px; border-radius: 2px; background: rgba(255, 255, 255, .16); overflow: hidden; }
#fill { height: 100%; width: 0; border-radius: 2px; background: linear-gradient(90deg, #F43F5E, #EC4899 60%, #8B5CF6); transition: width 1s linear; }
/* a small equalizer that dances while the music plays */
#eq { flex: none; display: flex; align-items: flex-end; gap: 2px; height: 14px; }
#eq i { width: 3px; height: 14px; border-radius: 2px; background: linear-gradient(180deg, #F751A1, #8B5CF6); transform-origin: bottom;
	transform: scaleY(.3); animation: eq .9s ease-in-out infinite; animation-play-state: paused; }
#eq i:nth-child(2) { animation-duration: .7s; animation-delay: -.2s; }
#eq i:nth-child(3) { animation-duration: 1.1s; animation-delay: -.5s; }
#eq i:nth-child(4) { animation-duration: .8s; animation-delay: -.35s; }
#card.on #eq i { animation-play-state: running; }
@keyframes eq { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }

/* on every new song a white tag rises from behind the card: "Powered by Audial", then slides back after a few seconds */
/* the slot sits right on top of the card and hides the tag while it is down (the card is see-through, so it can't hide it) */
#slot { position: absolute; left: 18px; bottom: 100%; height: 20px; overflow: hidden; }
#tag { display: flex; align-items: center; gap: 5px; height: 20px; box-sizing: border-box;
	padding: 3px 11px 0; border-radius: 9px 9px 0 0; background: #fff; color: #4B5060; font-size: 11.5px; line-height: 14px;
	font-weight: 600; letter-spacing: .3px; white-space: nowrap;
	transform: translateY(100%); transition: transform .45s cubic-bezier(.4, 0, .6, 1); }
#tag b { font-size: 12.5px; font-weight: 800; letter-spacing: .2px; background: linear-gradient(90deg, #F43F5E, #F751A1 55%, #8B5CF6);
	-webkit-background-clip: text; background-clip: text; color: transparent; }
#tag i { width: 7px; height: 7px; border-radius: 50%; background: linear-gradient(135deg, #F43F5E, #8B5CF6); }
#stage.sponsor #tag { transform: none; transition: transform .6s .9s cubic-bezier(.34, 1.56, .64, 1); }
/* live alerts (a follow, a gift) use the same tag: it rises with the same bounce, holds a few seconds and goes back */
#slot { max-width: 384px; }
#tag .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: #111318; font-weight: 800; }
#tag .what { flex: none; max-width: 250px; overflow: hidden; text-overflow: ellipsis; }
#stage.alert #tag { transform: none; transition: transform .6s .1s cubic-bezier(.34, 1.56, .64, 1); }

/* the song change, about 1.5 s:
   out: the old title and artist slide left and blur away, the cover turns its back;
   in:  a rose-to-violet light wipes across the card and lights its border, the new cover flips in with a bounce and a
        pulse of light, the title comes in letter by letter out of a blur, then the artist, then the white tag */
#card.out #title, #card.out #artist { opacity: 0; transform: translateX(-18px); filter: blur(6px); transition: opacity .26s ease-in, transform .26s ease-in, filter .26s ease-in; }
#card.out #art { transform: rotateY(-90deg) scale(.92); transition: transform .26s ease-in; }
#wipe { position: absolute; inset: 0; pointer-events: none; transform: translateX(-100%);
	background: linear-gradient(100deg, rgba(0, 0, 0, 0) 25%, rgba(244, 63, 94, .38) 44%, rgba(139, 92, 246, .38) 56%, rgba(0, 0, 0, 0) 75%); }
#card.in { animation: glow 1.5s ease-out; }
#card.in #wipe { animation: wipe .9s cubic-bezier(.45, 0, .2, 1) both; }
#card.in #art { animation: flip .8s .12s cubic-bezier(.2, .9, .25, 1.15) both; }
#card.in #ring { animation: ring 1s .5s ease-out both; }
#card.in .ch { animation: letter .55s cubic-bezier(.2, .8, .2, 1) both; animation-delay: var(--d); }
#card.in #artist { animation: rise .55s .55s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes wipe { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
@keyframes glow {
	0% { border-color: rgba(255, 255, 255, .1); box-shadow: 0 0 0 0 rgba(247, 81, 161, 0); }
	30% { border-color: rgba(247, 81, 161, .85); box-shadow: 0 0 18px 0 rgba(247, 81, 161, .5); }
	100% { border-color: rgba(255, 255, 255, .1); box-shadow: 0 0 0 0 rgba(247, 81, 161, 0); } }
@keyframes flip {
	0% { transform: rotateY(90deg) scale(.9); opacity: .3; }
	60% { transform: rotateY(-10deg) scale(1.05); opacity: 1; }
	100% { transform: none; } }
@keyframes ring { from { box-shadow: 0 0 0 0 rgba(247, 81, 161, .8); } to { box-shadow: 0 0 0 12px rgba(247, 81, 161, 0); } }
@keyframes letter { from { opacity: 0; transform: translateY(14px) scale(.9); filter: blur(5px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
/* Christmas (Nov 12 to Jan 6, Dia de Reis): a garland of lights hung in arcs from little nails along the top of the card and a Santa hat on the cover */
#garland { display: none; position: absolute; left: 98px; right: 12px; top: 0; height: 18px; z-index: 2; pointer-events: none; overflow: visible; }
#stage.xmas #garland { display: block; }
#garland .wire { fill: none; stroke: rgba(255, 255, 255, .38); stroke-width: 1; }
#garland .nail { fill: #9CA3AF; stroke: #111318; stroke-width: .6; }
#garland .cap { fill: #6B7280; }
#garland .bulb { animation: twinkle 2.4s ease-in-out infinite; }
#garland .c1 { fill: #F43F5E; filter: drop-shadow(0 0 2.5px #F43F5E); }
#garland .c2 { fill: #F751A1; filter: drop-shadow(0 0 2.5px #F751A1); animation-delay: -.8s; }
#garland .c3 { fill: #8B5CF6; filter: drop-shadow(0 0 2.5px #8B5CF6); animation-delay: -1.6s; }
@keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
#stage.xmas #artbox::after { content: ""; position: absolute; left: -10px; top: -9px; width: 32px; height: 26px; z-index: 2; pointer-events: none;
	background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 32'><path d='M5 25 C9 12 18 3 28 4 C33 5 35 10 36 16 C31 12 27 13 25 17 L33 25 Z' fill='%23E11D48'/><rect x='2' y='22' width='34' height='8' rx='4' fill='%23fff'/><circle cx='36' cy='17' r='4' fill='%23fff'/></svg>") center / contain no-repeat; transform: rotate(-14deg); filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .5)); }
/* ---------- Neon Vice (#<id>&theme=vice, or "theme": "vice" in the message): the same card, at a Miami sunset ----------
   A sky going orange, magenta and violet over the sea, a striped sun on the horizon, palm and skyline silhouettes, a
   neon tube around the card. Same 440 x 120 as the usual look. Everything that moves
   is transform or opacity on its own layer (plus a few text-shadows during an entrance), so OBS stays at 60 fps. */
#scene, #frame { display: none; }
.vice #scene, .vice #frame { display: block; }
.vice #card { height: 96px; padding: 12px; border: 0; border-radius: 14px; background: #0B0219; transform: none; transition: opacity .25s; }
.vice #card.in { animation: none; }
.vice #artbox, .vice #info { position: relative; z-index: 3; }
.vice #garland { z-index: 6; }
#scene { position: absolute; inset: 0; z-index: 0; overflow: hidden; border-radius: inherit; pointer-events: none; }
#scene > * { position: absolute; }
#sky { left: 0; right: 0; top: 0; height: 66px; overflow: hidden;
	background: linear-gradient(180deg, #160733 0%, #3E1361 30%, #9B2378 58%, #E8456F 82%, #FF8A4C 100%); }
#halo { position: absolute; left: 258px; top: -26px; width: 190px; height: 130px; background: radial-gradient(closest-side, rgba(255, 176, 96, .6), rgba(255, 46, 136, .22) 58%, rgba(255, 46, 136, 0)); }
#sun { position: absolute; left: 318px; top: 10px; width: 68px; height: 68px; border-radius: 50%; will-change: transform;
	background: linear-gradient(180deg, #FFF3A6 0%, #FFC861 26%, #FF8A3D 50%, #FF3F7F 76%, #E0247A 100%);
	-webkit-mask-image: linear-gradient(180deg, #000 0 49%, transparent 49% 52%, #000 52% 58%, transparent 58% 61.5%, #000 61.5% 66%, transparent 66% 70.5%, #000 70.5% 74%, transparent 74% 79%, #000 79%);
	mask-image: linear-gradient(180deg, #000 0 49%, transparent 49% 52%, #000 52% 58%, transparent 58% 61.5%, #000 61.5% 66%, transparent 66% 70.5%, #000 70.5% 74%, transparent 74% 79%, #000 79%); }
#sea { left: 0; right: 0; top: 66px; bottom: 0; background: linear-gradient(180deg, #3A0E4F, #12042A 70%, #0A0218); }
#glint { left: 322px; top: 67px; width: 60px; height: 24px; background: repeating-linear-gradient(180deg, rgba(255, 160, 120, .8) 0 1.5px, rgba(255, 160, 120, 0) 1.5px 4px);
	-webkit-mask-image: radial-gradient(closest-side, #000, transparent); mask-image: radial-gradient(closest-side, #000, transparent); }
#horizon { left: 0; right: 0; top: 65.5px; height: 1px; background: linear-gradient(90deg, rgba(255, 120, 180, 0) 20%, rgba(255, 120, 180, .6) 55%, #FFC0DA 80%, rgba(255, 120, 180, .7));
	box-shadow: 0 0 6px 1px rgba(255, 46, 136, .55); }
#dusk { inset: 0; opacity: 0; background: linear-gradient(180deg, rgba(12, 3, 40, .82), rgba(5, 1, 15, .6)); }
#palms { left: 0; top: 0; width: 420px; height: 96px; }
#shade { inset: 0; background: linear-gradient(90deg, rgba(9, 2, 22, .96) 0, rgba(9, 2, 22, .9) 40%, rgba(9, 2, 22, .45) 68%, rgba(9, 2, 22, 0) 88%); }

/* the neon tube: three strokes of the same outline (wide faint glow, glow, white-hot core) instead of a blur filter */
#frame { position: absolute; left: 0; top: 0; width: 420px; height: 96px; z-index: 2; overflow: visible; pointer-events: none; opacity: 0; transition: opacity .25s; }
.vice #card.on + #frame { opacity: 1; }
#frame use { fill: none; stroke-linecap: round; }
#frame .fw { stroke: url(#vg); stroke-width: 8; stroke-opacity: .2; }
#frame .fm { stroke: url(#vg); stroke-width: 3.2; stroke-opacity: .6; }
#frame .fc { stroke: #FFE6F2; stroke-width: 1.2; }
#frame .tube { animation: hum 7s linear infinite; }
@keyframes hum { 0%, 88%, 90%, 92%, 100% { opacity: 1; } 89% { opacity: .55; } 91% { opacity: .78; } }
/* entrance: the outline is drawn from the left edge both ways round and meets on the right, then the glow catches with a flicker */
.vice #card.boot.in + #frame use { stroke-dasharray: 1 2; animation: draw .85s .05s cubic-bezier(.65, 0, .35, 1) both; }
.vice #card.boot.in + #frame .fw, .vice #card.boot.in + #frame .fm { animation: draw .85s .05s cubic-bezier(.65, 0, .35, 1) both, flick 1.1s .6s linear both; }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes flick { 0% { opacity: 0; } 7% { opacity: 1; } 10% { opacity: .12; } 15% { opacity: .9; } 18% { opacity: .2; } 23% { opacity: .2; }
	30% { opacity: 1; } 47% { opacity: .7; } 51%, 100% { opacity: 1; } }
.vice #card.boot.in #scene { animation: vfade .7s .2s ease-out both; }

/* the cover: a thin neon frame; it comes in out of a flash and leaves blurred into the dark */
.vice #art { border-radius: 8px; background: linear-gradient(160deg, #FF8A3D, #FF2E88 55%, #6D28D9);
	box-shadow: 0 0 0 1px rgba(255, 196, 224, .9), 0 0 10px rgba(255, 46, 136, .75), 0 0 22px rgba(255, 46, 136, .3); }
.vice #ring { border-radius: 8px; }
.vice #card.in #art { animation: vart .8s .12s cubic-bezier(.2, 1.3, .3, 1) both; }
.vice #card.boot.in #art { animation-delay: .5s; }
.vice #card.in #ring { animation: vring 1s .55s cubic-bezier(.2, .7, .3, 1) both; }
.vice #card.boot.in #ring { animation-delay: .95s; }
.vice #card.out #art { opacity: 0; transform: scale(.86) translateY(4px); filter: blur(5px) brightness(.5); transition: all .32s cubic-bezier(.7, 0, .84, 0); }
@keyframes vart { 0% { opacity: 0; transform: scale(.72) rotate(-8deg); filter: blur(6px) brightness(2.2); } 55% { opacity: 1; filter: blur(0) brightness(1.4); } 100% { transform: none; filter: none; } }
@keyframes vring { from { box-shadow: 0 0 0 0 rgba(45, 226, 230, .9); } to { box-shadow: 0 0 0 14px rgba(45, 226, 230, 0); } }

/* the title: condensed capitals, a white-hot core in a magenta glow. Each letter shoots in from the right stretched and
   split in colour (motion blur and chromatic aberration), and a flare runs along the letters right after */
.vice #title { margin: -6px -6px -4px; padding: 6px 6px 4px; font-family: "Bebas Neue", Impact, "Arial Narrow", sans-serif; font-weight: 400; font-size: 27px; line-height: 28px;
	letter-spacing: 1px; text-transform: uppercase; color: #FFF1F8;
	text-shadow: 0 0 0 rgba(45, 226, 230, 0), 0 0 6px rgba(255, 46, 136, .9), 0 0 16px rgba(255, 46, 136, .45); }
.vice #card.in .ch { animation: vletter .62s cubic-bezier(.16, 1.18, .3, 1) both, vshine .7s ease-out; animation-delay: var(--d), calc(var(--d) + 380ms); }
.vice #card.boot.in .ch { animation-delay: calc(var(--d) + 480ms), calc(var(--d) + 860ms); }
@keyframes vletter {
	0% { opacity: 0; transform: translateX(30px) scaleX(1.7) skewX(-16deg); filter: blur(3px);
		text-shadow: -5px 0 1px rgba(45, 226, 230, .95), 5px 0 1px rgba(255, 46, 136, .95), 0 0 16px rgba(255, 46, 136, 0); }
	45% { opacity: 1; filter: blur(0); text-shadow: -2px 0 0 rgba(45, 226, 230, .8), 2px 0 0 rgba(255, 46, 136, .8), 0 0 16px rgba(255, 46, 136, .3); }
	100% { transform: none; filter: none; text-shadow: 0 0 0 rgba(45, 226, 230, 0), 0 0 6px rgba(255, 46, 136, .9), 0 0 16px rgba(255, 46, 136, .45); } }
@keyframes vshine { 30% { color: #fff; text-shadow: 0 0 2px #fff, 0 0 8px #FFD08A, 0 0 22px rgba(255, 138, 61, .95); } }
.vice #card.out #title, .vice #card.out #artist { opacity: 0; transform: translateX(-36px) scaleX(1.4) skewX(18deg); transform-origin: left center; filter: blur(4px);
	transition: transform .34s cubic-bezier(.7, 0, .84, 0), opacity .34s cubic-bezier(.7, 0, .84, 0), filter .34s; }
.vice #artist { margin-top: 1px; padding: 0 4px 0 1px; font-family: "Kaushan Script", "Brush Script MT", cursive; font-size: 16px; line-height: 21px; color: #8FF8FF;
	text-shadow: 0 0 5px rgba(45, 226, 230, .85), 0 0 14px rgba(45, 226, 230, .35); }
.vice #card.in #artist { animation: vartist .7s .62s cubic-bezier(.2, 1.4, .4, 1) both; }
.vice #card.boot.in #artist { animation-delay: 1.05s; }
@keyframes vartist { from { opacity: 0; transform: translateX(-14px) skewX(12deg); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
.vice #bar { height: 3px; margin-top: 7px; border-radius: 2px; background: rgba(255, 255, 255, .1); overflow: visible; }
.vice #fill { position: relative; background: linear-gradient(90deg, #FFB347, #FF2E88 60%, #B23CFF); box-shadow: 0 0 6px rgba(255, 46, 136, .85); }
.vice #fill::after { content: ""; position: absolute; right: -3px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: #fff;
	box-shadow: 0 0 5px 2px rgba(255, 46, 136, .9), 0 0 12px 3px rgba(178, 60, 255, .45); }
/* the equalizer stands at the end of the progress line, over the dark island under the palms, where it reads best */
.vice #bar { margin-right: 32px; }
.vice #eq { position: absolute; right: 0; bottom: -4px; height: 18px; gap: 3px; }
/* a soft pool of light behind the bars (static, so it costs nothing per frame) */
.vice #eq::before { content: ""; position: absolute; left: -12px; right: -12px; top: -6px; bottom: -8px; z-index: -1; pointer-events: none;
	background: radial-gradient(closest-side, rgba(255, 46, 136, .45), rgba(178, 60, 255, .18) 60%, rgba(178, 60, 255, 0)); }
.vice #eq i { height: 18px; border-radius: 1.5px; background: linear-gradient(180deg, #FFF3A6, #FF8A3D 35%, #FF2E88 72%, #9D4BFF);
	box-shadow: 0 0 3px rgba(255, 220, 235, .9), 0 0 8px rgba(255, 46, 136, .95), 0 0 16px rgba(255, 46, 136, .55), 0 0 26px rgba(178, 60, 255, .35); animation-name: veq; animation-timing-function: cubic-bezier(.45, 0, .55, 1); }
@keyframes veq { 0%, 100% { transform: scaleY(.2); } 28% { transform: scaleY(1); } 52% { transform: scaleY(.42); } 76% { transform: scaleY(.82); } }

/* the song change, about 1.6 s, an evening falling and lifting: the old title smears off to the left as the sun sinks
   into the sea and the sky goes dark; a beam of light sweeps across, and the sun climbs back with a little overshoot */
.vice #card.out #sun { transform: translateY(48px) scaleX(1.06); transition: transform .42s cubic-bezier(.7, 0, .84, 0); }
.vice #card.out #halo, .vice #card.out #glint { opacity: .12; transition: opacity .42s ease-in; }
.vice #card.out #dusk { opacity: 1; transition: opacity .42s ease-in; }
.vice #card.in #sun { animation: vsun 1.15s .2s cubic-bezier(.22, 1.25, .36, 1) both; }
.vice #card.boot.in #sun { animation-delay: .35s; animation-duration: 1.4s; }
.vice #card.in #halo, .vice #card.in #glint { animation: vglow 1s .4s ease-out both; }
.vice #card.in #dusk { animation: vdusk 1.1s .15s cubic-bezier(.4, 0, .2, 1) both; }
@keyframes vsun { from { transform: translateY(48px) scaleX(1.06); } to { transform: none; } }
@keyframes vglow { from { opacity: .12; } to { opacity: 1; } }
@keyframes vdusk { from { opacity: 1; } to { opacity: 0; } }
@keyframes vfade { from { opacity: 0; } to { opacity: 1; } }
.vice #wipe { z-index: 4; inset: 0 auto 0 -45%; width: 45%; opacity: 0; mix-blend-mode: screen; transform: skewX(-22deg);
	background: linear-gradient(90deg, rgba(255, 138, 61, 0), rgba(255, 138, 61, .28) 30%, rgba(255, 236, 214, .68) 50%, rgba(255, 46, 136, .32) 70%, rgba(255, 46, 136, 0)); }
.vice #card.in #wipe { animation: vwipe .78s .05s cubic-bezier(.75, 0, .2, 1) both; }
.vice #card.boot.in #wipe { animation: none; }
@keyframes vwipe { 0% { opacity: 1; transform: translateX(0) skewX(-22deg) scaleX(.5); } 50% { transform: translateX(165%) skewX(-22deg) scaleX(1.7); }
	99% { opacity: 1; } 100% { opacity: 0; transform: translateX(330%) skewX(-22deg) scaleX(.5); } }

/* the tag becomes a small neon sign over the card, animated like a title card:
   in:  the box opens from its centre with a flash, the script line is written on from left to right (a soft-edged mask,
        glowing hot while it writes), then the capitals switch on one by one with a neon flicker;
   out: the writing is wiped back and the box closes on its centre.
   The entrance only fills backwards: once it is over the class alone holds the sign on, so taking the class off runs the
   way out as plain transitions. --t is when the sign starts (after the song's entrance, or at once for an alert). */
.vice #slot { left: 16px; bottom: calc(100% + 2px); height: 18px; overflow: visible; }
.vice #tag { gap: 6px; height: 18px; padding: 0 10px; border: 1px solid rgba(255, 120, 190, .9); border-radius: 6px; background: rgba(13, 3, 28, .9);
	box-shadow: 0 0 6px rgba(255, 46, 136, .75), inset 0 0 6px rgba(255, 46, 136, .35); color: #FFB3D6;
	font: 400 13px/16px "Kaushan Script", "Brush Script MT", cursive; letter-spacing: 0; text-shadow: 0 0 5px rgba(255, 46, 136, .9);
	transform: none; opacity: 0; clip-path: inset(-12px 50% -12px 50% round 6px);
	transition: clip-path .3s .14s cubic-bezier(.55, 0, .45, 1), opacity .08s .38s; }
.vice #tag b { padding-top: 1px; font: 400 11px/16px Monoton, "Bebas Neue", sans-serif; letter-spacing: 1px; background: none; color: #FFE08A;
	text-shadow: 0 0 4px rgba(255, 170, 60, .95), 0 0 10px rgba(255, 120, 40, .6); }
.vice #tag i { width: auto; height: auto; border-radius: 0; background: none; font: normal 11px/16px "Segoe UI Symbol", sans-serif; color: #8FF8FF; text-shadow: 0 0 5px rgba(45, 226, 230, .9); }
.vice #tag i::before { content: "\2726"; }
.vice #tag[data-kind="request"] i::before { content: "\266A"; font-size: 13px; }
.vice #tag .what { padding-right: 2px; }
.vice #tag .who { padding-top: 2px; font: 400 15px/16px "Bebas Neue", Impact, sans-serif; letter-spacing: .8px; color: #C8FCFF; text-shadow: 0 0 5px rgba(45, 226, 230, .9); }
.vice #tag .w { padding: 0 3px 0 1px; -webkit-mask: linear-gradient(90deg, #000 48%, transparent 58%) 100% 0 / 220% 100% no-repeat; mask: linear-gradient(90deg, #000 48%, transparent 58%) 100% 0 / 220% 100% no-repeat;

let alertUp = false;

		case "sub": return "se inscreveu";
		case "superchat": return "mandou Super Chat " + a.gift.slice(0, 20);
		case "sticker": return "mandou Super Sticker " + a.gift.slice(0, 20);

	clearTimeout(swapTimer);
	// "boot": the card was off, so Neon Vice draws and lights its neon instead of the song-change transition
	$("card").classList.toggle("boot", !wasOn);
	if (wasOn && !reduced) {
		$("card").classList.remove("in");
		$("card").classList.add("out");
		swapTimer = setTimeout(() => enter(n), $("stage").classList.contains("vice") ? 430 : 280);
	} else {
		enter(n);
	}
}
function show(next) {
	const wasOn = $("card").classList.contains("on");
	now = clean(next);
	if (now.playing) {
		const key = now.title + "\n" + now.artist;
		if (key !== song) {
			song = key;
			announce(now, wasOn);
		}
		if (!(now.duration > 0)) $("fill").style.width = "0";
	}
	tick();
}
// The relay connection is kept alive by hand: OBS keeps the page open for hours, and a stream that drops (sleep, Wi-Fi,
// the relay restarting, a refused reconnect) either closes for good or goes quiet without an error. The relay sends a
// keepalive every 45 s, so silence for longer than that means the stream is dead: open a new one, which starts with
// the latest message (the current song).
let relay = null;
let lastSeen = 0;
let retry = 0;
let retryTimer = 0;
function connect() {
	clearTimeout(retryTimer);
	retryTimer = 0;
	if (relay) relay.close();
	lastSeen = Date.now();
	relay = new EventSource("https://ntfy.sh/audial-live-" + id + "/sse?since=latest");
	const alive = () => { lastSeen = Date.now(); retry = 0; };
	relay.addEventListener("open", alive);
	relay.addEventListener("keepalive", alive);
	relay.onmessage = event => {
		alive();
		try {
			const m = JSON.parse(JSON.parse(event.data).message);
			show(m);
			if (m && typeof m === "object" && typeof m.xmas === "boolean") {
				xmasOn = m.xmas;
				$("stage").classList.toggle("xmas", season && xmasOn);
			}
			if (m && typeof m === "object" && (m.theme === "vice" || m.theme === "audial")) setTheme(m.theme);
			if (m && typeof m === "object" && m.alerts) takeAlerts(m.alerts, num(m.sentAt));
		} catch {}
	};
	relay.onerror = () => {
		if (relay.readyState === EventSource.CLOSED) {
			retry = Math.min(retry + 1, 6);
			retryTimer = setTimeout(connect, 2000 * retry * retry);
		}
	};
}
// Neon Vice's signature (see the CSS). The glow trails the tube by two frames (33 ms); the spark rides the pen's tip.
const sign = { len: 0, raf: 0, twitch: 0 };
function signAt(p, g) {
	const box = $("sig");
	if (!sign.len) {
		sign.len = document.getElementById("sgt").getTotalLength();
		box.querySelectorAll("use").forEach(u => u.style.strokeDasharray = sign.len + " " + sign.len * 2);
	}
	box.querySelectorAll(".tc").forEach(u => u.style.strokeDashoffset = sign.len * (1 - p));
	box.querySelectorAll(".tg").forEach(u => u.style.strokeDashoffset = sign.len * (1 - g));
	const spark = box.querySelector(".spark");
	const tip = document.getElementById("sgt").getPointAtLength(sign.len * p);
	spark.setAttribute("cx", tip.x);
	spark.setAttribute("cy", tip.y);
	spark.style.opacity = p > 0 && p < 1 ? 1 : 0;
	// the i's stem ends about halfway along the line
	box.classList.toggle("dot", p >= .49);
}
function writeSign() {
	const box = $("sig");
	cancelAnimationFrame(sign.raf);
	box.classList.remove("lit", "blink");
	if (reduced) {
		signAt(1, 1);
		return;
	}
	signAt(0, 0);
	const start = performance.now() + 900, length = 1400;
	const ease = t => t < .5 ? 2 * t * t : 1 - (2 - 2 * t) ** 2 / 2;
	const clamp = t => Math.min(1, Math.max(0, t));
	const frame = now => {
		const t = (now - start) / length;
		const g = ease(clamp(t - 33 / length));
		signAt(ease(clamp(t)), g);
		if (g < 1) sign.raf = requestAnimationFrame(frame);
		else box.classList.add("lit");
	};
	sign.raf = requestAnimationFrame(frame);
}
function blinkSign() {
	const box = $("sig");
	if (reduced || !box.classList.contains("lit")) return;
	box.classList.remove("blink");
	void box.offsetWidth;
	box.classList.add("blink");
}
// a micro-flicker every 6 to 9 s, at random
function twitchSign() {
	clearTimeout(sign.twitch);
	sign.twitch = setTimeout(() => {
		if ($("stage").classList.contains("vice") && $("card").classList.contains("on")) blinkSign();
		twitchSign();
	}, 6000 + Math.random() * 3000);
}
// Looks: "audial" (the usual) or "vice" (Neon Vice). The link picks the first one; the app's messages can switch it live.
// Neon Vice's fonts (Bebas Neue, Kaushan Script, Monoton, all SIL Open Font License) come from Google Fonts, only for it.
let fontsAsked = false;
function setTheme(name) {
	const vice = name === "vice";
	$("stage").classList.toggle("vice", vice);
	if (vice) {
		signAt(1, 1);
		$("sig").classList.add("lit");
		twitchSign();
	}
	if (vice && !fontsAsked) {
		fontsAsked = true;
		const link = document.createElement("link");
		link.rel = "stylesheet";
		link.href = "https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Kaushan+Script&family=Monoton&display=swap";
		// fetch the fonts right away, so the first title doesn't come in with a stand-in font
		link.onload = () => ['27px "Bebas Neue"', '16px "Kaushan Script"', "11px Monoton"].forEach(f => document.fonts.load(f).catch(() => {}));
		document.head.appendChild(link);
	}
}
setTheme(new URLSearchParams(linkOptions.join("&")).get("theme"));
// Christmas theme: in season (November 12 to January 6, Dia de Reis) unless the app says it is turned off ("xmas": false)
const season = (() => { const d = new Date(), m = d.getMonth(), day = d.getDate(); return (m === 10 && day >= 12) || m === 11 || (m === 0 && day <= 6); })();
let xmasOn = true;
$("stage").classList.toggle("xmas", season);
if (/^[0-9a-f]{32}$/.test(id)) {
	connect();
	setInterval(() => {
		tick();
		if (Date.now() - lastSeen > 100000 && !retryTimer) connect();
	}, 1000);
	document.addEventListener("visibilitychange", () => {
		if (!document.hidden && Date.now() - lastSeen > 50000) connect();
	});
}
</script>
