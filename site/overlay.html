<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Audial Overlay</title>
<style>
html, body { margin: 0; background: transparent; overflow: hidden; font-family: "Segoe UI", Arial, sans-serif; }
#card { position: relative; overflow: hidden; display: flex; align-items: center; gap: 14px; box-sizing: border-box; width: 420px; padding: 12px; margin: 8px;
	border-radius: 16px; background: rgba(17, 19, 25, .86); border: 1px solid rgba(255, 255, 255, .1); color: #fff;
	opacity: 0; transform: translateY(8px); transition: opacity .35s, transform .35s; }
#card.on { opacity: 1; transform: none; }
#art { flex: none; width: 72px; height: 72px; border-radius: 10px; object-fit: cover; background: linear-gradient(45deg, #F43F5E, #EC4899); }
#info { flex: 1; min-width: 0; }
/* the top line is a two-line ticker: "OUVINDO NO AUDIAL", and on every new song it rolls up to "SPONSORED BY AUDIAL" */
#label { height: 14px; overflow: hidden; font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: 1.5px; color: #FB7185; }
#roll { transition: transform .5s cubic-bezier(.2, .8, .2, 1); }
#roll div { height: 14px; white-space: nowrap; }
#card.sponsor #roll { transform: translateY(-14px); }
#roll b { font-weight: 800; background: linear-gradient(90deg, #FF8FA3, #F751A1 50%, #B794F6); -webkit-background-clip: text; background-clip: text; color: transparent; }
#title, #artist { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* a new song: title and artist rise into place, the cover pops and a light sweeps across the card */
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(.86); } 60% { transform: scale(1.04); } 100% { transform: none; } }
@keyframes sweep { from { transform: translateX(-120%) skewX(-18deg); } to { transform: translateX(260%) skewX(-18deg); } }
#card.swap #title { animation: rise .5s cubic-bezier(.2, .8, .2, 1) both; }
#card.swap #artist { animation: rise .5s .08s cubic-bezier(.2, .8, .2, 1) both; }
#card.swap #art { animation: pop .55s cubic-bezier(.2, .8, .2, 1); }
#shine { position: absolute; top: 0; bottom: 0; left: 0; width: 40%; pointer-events: none; opacity: 0;
	background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(247, 81, 161, .22), rgba(255, 255, 255, 0)); }
#card.swap #shine { opacity: 1; animation: sweep 1.1s .1s ease-out both; }
@media (prefers-reduced-motion: reduce) { #card.swap #title, #card.swap #artist, #card.swap #art, #card.swap #shine { animation: none; } }
#title { font-size: 19px; font-weight: 600; margin-top: 2px; }
#artist { font-size: 14px; color: #D4D4D8; }
#bar { height: 4px; margin-top: 8px; border-radius: 2px; background: rgba(255, 255, 255, .16); overflow: hidden; }
#fill { height: 100%; width: 0; border-radius: 2px; background: linear-gradient(90deg, #F43F5E, #EC4899); transition: width 1s linear; }
</style>
</head>
<body>
<!-- The site's security policy (vercel.json) only runs this page's script by its SHA-256: after editing the script, update that hash. -->
<div id="card">
	<div id="shine"></div>
	<img id="art" alt="">
	<div id="info">
		<div id="label"><div id="roll"><div>OUVINDO NO AUDIAL</div><div>SPONSORED BY <b>AUDIAL</b></div></div></div>
		<div id="title"></div>
		<div id="artist"></div>
		<div id="bar"><div id="fill"></div></div>
	</div>
</div>
<script>
const $ = id => document.getElementById(id);
const id = location.hash.slice(1);
let cover = null;
let now = null;
function elapsed() {
	return now.position + (Date.now() - now.sentAt) / 1000;
}
function tick() {
	const ended = now && now.duration > 0 && elapsed() > now.duration + 5;
	const on = !!now && now.playing && !ended;
	$("card").classList.toggle("on", on);
	if (on && now.duration > 0) $("fill").style.width = Math.min(100, elapsed() / now.duration * 100) + "%";
}
// The channel is public to whoever has the link, so only well-formed messages get on screen: short text, real numbers
// and covers from YouTube's image servers only.
const text = v => typeof v === "string" ? v.slice(0, 200) : "";
const num = v => typeof v === "number" && isFinite(v) ? v : 0;
function youtubeImage(url) {
	try {
		const u = new URL(url);
		return u.protocol === "https:" && !u.port && !u.username && /\.(ytimg\.com|googleusercontent\.com|ggpht\.com)$/.test(u.hostname) ? u.href : null;
	} catch { return null; }
}
function clean(m) {
	if (!m || typeof m !== "object" || m.playing !== true) return { playing: false };
	return { playing: true, title: text(m.title), artist: text(m.artist), artwork: typeof m.artwork === "string" ? youtubeImage(m.artwork) : null,
		position: Math.max(0, num(m.position)), duration: Math.max(0, num(m.duration)), sentAt: num(m.sentAt) || Date.now() };
}
// A new song (not a seek in the same one) replays the entrance and shows "SPONSORED BY AUDIAL" for a few seconds.
let song = "";
let sponsorTimer = 0;
function announce() {
	const card = $("card");
	card.classList.remove("swap");
	void card.offsetWidth;
	card.classList.add("swap", "sponsor");
	clearTimeout(sponsorTimer);
	sponsorTimer = setTimeout(() => card.classList.remove("sponsor"), 4500);
}
function show(next) {
	now = clean(next);
	if (now.playing) {
		const key = now.title + "\n" + now.artist;
		if (key !== song) {
			song = key;
			announce();
		}
		$("title").textContent = now.title;
		$("artist").textContent = now.artist;
		if (now.artwork !== cover) {
			cover = now.artwork;
			if (cover) $("art").src = cover; else $("art").removeAttribute("src");
		}
		if (!(now.duration > 0)) $("fill").style.width = "0";
	}
	tick();
}
if (/^[0-9a-f]{32}$/.test(id)) {
	const relay = new EventSource("https://ntfy.sh/audial-live-" + id + "/sse?since=latest");
	relay.onmessage = event => {
		try {
			show(JSON.parse(JSON.parse(event.data).message));
		} catch {}
	};
	setInterval(tick, 1000);
}
</script>
</body>
</html>
